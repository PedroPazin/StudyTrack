<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Planejamento e Acompanhamento de Estudos</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <aside class="sidebar">
      <div class="sidebar-logo">
        <h1><i class="fas fa-book"></i> StudyTrack</h1>
        <p>Planejamento de Estudos</p>
      </div>

      <button class="nav-btn active" onclick="mostrarSecao('dashboard', this)">
        <i class="fas fa-chart-line"></i> Dashboard
      </button>

      <button class="nav-btn" onclick="mostrarSecao('disciplinas', this)">
        <i class="fas fa-graduation-cap"></i> Disciplinas
      </button>

      <button class="nav-btn" onclick="mostrarSecao('metas', this)">
        <i class="fas fa-bullseye"></i> Metas
      </button>

      <button class="nav-btn" onclick="mostrarSecao('registros', this)">
        <i class="fas fa-clock"></i> Registros
      </button>
    </aside>

    <div class="main">
      <header>
        <div>
          <h1><i class="fas fa-book"></i> Bem Vindo Estudante!</h1>
          <p>Sistema de Planejamento e Acompanhamento de Estudos</p>
        </div>
      </header>

      <div class="section-panel active" id="sec-dashboard">
        <div class="dashboard">
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              margin-bottom: 20px;
            "
          >
            <h2><i class="fas fa-chart-line"></i> Painel de Desempenho</h2>
            <button
              id="btn-alternar-vista"
              class="filtro-btn"
              style="
                background: #b91c1c;
                color: white;
                padding: 8px 16px;
                border-radius: 8px;
                cursor: pointer;
                border: none;
              "
            >
              <i class="fas fa-chart-bar"></i> Ver em Gráfico
            </button>
          </div>

          <div id="vista-barras">
            <div class="relatorios-grid" style="margin-top: 15px"></div>
          </div>

          <div id="vista-grafico" style="display: none">
            <div
              style="
                display: flex;
                justify-content: flex-end;
                align-items: center;
                flex-wrap: wrap;
                gap: 10px;
              "
            >
              <div class="filtros">
                <button class="filtro-btn active" data-periodo="semana">
                  Esta Semana
                </button>
                <button class="filtro-btn" data-periodo="mes">Este Mês</button>
                <button class="filtro-btn" data-periodo="total">Total</button>
              </div>
            </div>
            <div
              class="grafico-container"
              style="
                background: white;
                padding: 20px;
                border-radius: 20px;
                border: 1px solid #ffdbdb;
                height: 350px;
                margin-top: 15px;
              "
            >
              <canvas id="meuGraficoSemanas"></canvas>
            </div>
          </div>
        </div>
      </div>

      <div class="section-panel" id="sec-disciplinas">
        <section class="card">
          <h2><i class="fas fa-graduation-cap"></i> Cadastrar Disciplina</h2>
          <form>
            <div class="form-group">
              <label>Nome da Disciplina:</label>
              <input type="text" placeholder="ex: Cálculo I" />
            </div>
            <div class="form-group">
              <label>Carga Horária Prevista (horas):</label>
              <input type="number" min="1" placeholder="60" />
            </div>
            <button type="submit">
              <i class="fas fa-plus"></i> Adicionar Disciplina
            </button>
          </form>
          <div class="lista-itens">
            <p class="small-text">Nenhuma disciplina cadastrada.</p>
          </div>
        </section>
      </div>

      <div class="section-panel" id="sec-metas">
        <section class="card">
          <h2><i class="fas fa-bullseye"></i> Cadastrar Meta Semanal</h2>
          <form>
            <select>
              <option value="">Selecione uma disciplina...</option>
            </select>
            <div class="form-group">
              <label>Horas Meta por Semana:</label>
              <input type="number" step="0.5" min="1" placeholder="ex: 4" />
            </div>
            <button type="submit">
              <i class="fas fa-plus"></i> Adicionar Meta
            </button>
          </form>
          <div class="lista-itens">
            <p class="small-text">Nenhuma meta cadastrada.</p>
          </div>
        </section>
      </div>

      <div class="section-panel" id="sec-registros">
        <section class="card">
          <h2><i class="fas fa-clock"></i> Registrar Horas Estudadas</h2>
          <form>
            <select>
              <option value="">Selecione uma disciplina...</option>
            </select>
            <div class="form-group">
              <label>Data:</label>
              <input type="date" />
            </div>
            <div class="form-group">
              <label>Horas Estudadas:</label>
              <input type="number" min="0" step="0.1" placeholder="ex: 2.5" />
            </div>
            <button type="submit"><i class="fas fa-save"></i> Registrar</button>
          </form>
          <div class="lista-itens">
            <p class="small-text">Nenhum registro ainda.</p>
          </div>
        </section>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="js/main.js"></script>
    <script src="js/disciplina.js"></script>
    <script src="js/metas.js"></script>
    <script src="js/registro.js"></script>
    <script src="js/dashboard.js"></script>
  </body>
</html>
